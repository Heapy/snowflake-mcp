[versions]
kotlin = "2.3.10"
ktor = "3.2.3"
mcp-kotlin = "0.8.3"
exposed = "0.61.0"
snowflake-jdbc = "4.0.1"
sqlite-jdbc = "3.51.2.0"
kotlinx-html = "0.12.0"
logback = "1.5.29"
junit-jupiter = "6.0.2"

[libraries]
ktor-bom = { group = "io.ktor", name = "ktor-bom", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio" }
ktor-server-html = { group = "io.ktor", name = "ktor-server-html-builder" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json" }
ktor-server-sse = { group = "io.ktor", name = "ktor-server-sse" }
ktor-server-test = { group = "io.ktor", name = "ktor-server-test-host" }

mcp-kotlin-server = { group = "io.modelcontextprotocol", name = "kotlin-sdk-server", version.ref = "mcp-kotlin" }
mcp-kotlin-client = { group = "io.modelcontextprotocol", name = "kotlin-sdk-client", version.ref = "mcp-kotlin" }

exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-dao = { group = "org.jetbrains.exposed", name = "exposed-dao", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposed" }

snowflake-jdbc = { group = "net.snowflake", name = "snowflake-jdbc", version.ref = "snowflake-jdbc" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite-jdbc" }

kotlinx-html = { group = "org.jetbrains.kotlinx", name = "kotlinx-html-jvm", version.ref = "kotlinx-html" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
