name: Build

permissions:
  contents: read

on:
  - push
  - pull_request

jobs:
  build:
    name: "Build Application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: "Run tests and build distribution"
        run: ./gradlew build :app:distTar
      - uses: actions/upload-artifact@v6
        with:
          name: "Kotlin Application"
          path: "app/build/distributions/snowflake-mcp.tar"
          retention-days: 1
  build-and-push-image:
    name: "Build Docker Image"
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: "Kotlin Application"
          path: "app/build/distributions/"
      - name: "Untar files"
        run: mkdir -p app/build/install && tar -xvf app/build/distributions/snowflake-mcp.tar -C $_
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=snowflake-mcp
            org.opencontainers.image.description=MCP server for Snowflake
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}